<!-- The pop-out chart window: draws the chart sent from the task pane, fully interactive. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SankeyFlow chart</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            --bg: #ffffff;
            --text: #52514e;
            --bar-height: 36px;
            background: var(--bg);
            color: var(--text);
            font: 14px "Segoe UI", system-ui, sans-serif;
        }

        /* Checkerboard behind a transparent chart, like the task pane shows. */
        body.transparent {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
                linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
                linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }

        #stage {
            box-sizing: border-box;
            min-height: 100vh;
            padding: 16px;
        }

        /* With a chart, its left edge sits on the window's left side. */
        body.has-chart #stage {
            padding-left: 0;
        }

        /* No chart: the message is centred in the window. */
        body:not(.has-chart) #stage {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #message {
            text-align: center;
            max-width: 28em;
        }

        /* The chart is drawn at full size for this window's width (so dragging
           follows the pointer exactly); a tall chart scrolls. */
        #chart-frame {
            position: relative;
            width: max-content;
            margin: 0;
        }

        #chart-svg {
            display: block;
            touch-action: none; /* let touch drags move boxes instead of scrolling */
            user-select: none;
        }

        /* Dotted lines along the chart's right and bottom edges, so its size is
           clear (especially zoomed out). Hover one for that dimension; click it
           to change it (chartEdges.ts). CSS only: not part of the chart itself,
           and drawn over it so the chart keeps its exact size. */
        .chart-edges {
            position: relative;
            width: max-content;
        }

        .chart-edge {
            position: absolute;
            z-index: 1;
            cursor: pointer;
            outline: none;
        }

        .chart-edge-right {
            top: 0;
            right: 0;
            bottom: 0;
            width: 7px;
            border-right: 1px dotted rgba(128, 128, 128, 0.7);
        }

        .chart-edge-bottom {
            left: 0;
            right: 0;
            bottom: 0;
            height: 7px;
            border-bottom: 1px dotted rgba(128, 128, 128, 0.7);
        }

        .chart-edge:hover,
        .chart-edge:focus-visible,
        .chart-edge.active {
            border-color: #0f6cbd;
            border-right-style: solid;
            border-bottom-style: solid;
        }

        .chart-edge-right:hover,
        .chart-edge-right:focus-visible,
        .chart-edge-right.active {
            border-right-width: 2px;
        }

        .chart-edge-bottom:hover,
        .chart-edge-bottom:focus-visible,
        .chart-edge-bottom.active {
            border-bottom-width: 2px;
        }

        .chart-edge-label,
        .chart-edge-pop {
            position: fixed;
            z-index: 20;
            border: 1px solid rgba(128, 128, 128, 0.35);
            background: var(--bg);
            color: var(--text);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        }

        body.transparent .chart-edge-label,
        body.transparent .chart-edge-pop {
            background: #ffffff;
        }

        .chart-edge-label {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
        }

        .chart-edge-pop {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .chart-edge-pop-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-edge-input {
            width: 7em;
            padding: 3px 6px;
            border: 1px solid rgba(128, 128, 128, 0.45);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }

        .chart-edge-input:focus-visible {
            outline: 2px solid #0f6cbd;
            outline-offset: -1px;
        }

        .chart-edge-pop-unit,
        .chart-edge-pop-hint {
            font-size: 11px;
            opacity: 0.7;
        }

        .chart-edge-pop-hint {
            margin-top: 5px;
        }

        #chart-svg rect[role="button"]:focus-visible {
            stroke: #0f6cbd;
            stroke-width: 2;
        }

        /* Hover details, as in the task pane. */
        .tooltip {
            position: absolute;
            z-index: 2;
            max-width: 200px;
            padding: 6px 10px;
            border: 1px solid rgba(128, 128, 128, 0.35);
            border-radius: 6px;
            background: var(--bg);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            font-size: 12px;
            pointer-events: none;
        }

        .tt-title {
            font-weight: 600;
        }

        .tt-value {
            font-size: 16px;
            font-weight: 600;
        }

        .tt-hint {
            margin-top: 4px;
            font-size: 11px;
            opacity: 0.75;
        }

        /* Control bar across the top of the window, staying put as it scrolls.
           The chart starts below it, so its dotted edge never runs under the icons. */
        .chart-tools {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            box-sizing: border-box;
            height: var(--bar-height);
            padding: 0 6px;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 2px;
            background: var(--bg);
            border-bottom: 1px solid rgba(128, 128, 128, 0.25);
            white-space: nowrap;
        }

        /* The tools that need a chart (hidden while there's no data). */
        .chart-only {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* The options, after a thin divider: a text label, then an icon dropdown. */
        .toolbar-fields {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 5px;
            padding: 2px 0 2px 10px;
            border-left: 1px solid rgba(128, 128, 128, 0.25);
        }

        .toolbar-fields .field {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .toolbar-fields label {
            cursor: pointer;
        }

        .toolbar-fields input[type="color"] {
            width: 24px;
            height: 24px;
            padding: 0;
        }

        /* Icon dropdowns (iconSelect.ts), styled as in the task pane. */
        .icon-select {
            position: relative;
            display: flex;
        }

        .icon-select-btn {
            display: flex;
            align-items: center;
            gap: 1px;
            height: 26px;
            padding: 0 3px 0 4px;
            border: 1px solid rgba(128, 128, 128, 0.45);
            border-radius: 5px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .icon-select-btn:hover,
        .icon-select-btn.active {
            border-color: #0f6cbd;
            background: rgba(128, 128, 128, 0.18);
        }

        .icon-select-btn:focus-visible {
            outline: 2px solid #0f6cbd;
            outline-offset: 1px;
        }

        .icon-select-btn svg,
        .icon-select-item svg {
            display: block;
            flex: none;
        }

        .icon-select-caret {
            opacity: 0.6;
        }

        .icon-select-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 6;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 4px;
            border: 1px solid rgba(128, 128, 128, 0.35);
            border-radius: 6px;
            background: var(--bg);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        }

        body.transparent .icon-select-menu {
            background: #ffffff;
        }

        .icon-select-menu.align-right {
            left: auto;
            right: 0;
        }

        .icon-select-item {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 31px;
            padding: 0 10px 0 6px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--text);
            font: inherit;
            white-space: nowrap;
            text-align: left;
            cursor: pointer;
        }

        .icon-select-item:hover,
        .icon-select-item:focus-visible {
            background: rgba(128, 128, 128, 0.18);
            outline: none;
        }

        .icon-select-item.selected {
            border-color: #0f6cbd;
        }

        /* A transparent chart's --bg can't back the bar: keep it solid. */
        body.transparent .chart-tools {
            background: #ffffff;
        }

        /* Make room for the bar above the chart. */
        #stage {
            padding-top: var(--bar-height);
        }

        /* Buttons: small and faint, clearer on hover or keyboard focus. */

        .chart-tool {
            flex: none;
            width: 26px;
            height: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--text);
            opacity: 0.8;
            cursor: pointer;
            transition: opacity 0.15s, background-color 0.15s;
        }

        .chart-tool:hover:not(:disabled),
        .chart-tool:focus-visible {
            opacity: 1;
            background: rgba(128, 128, 128, 0.18);
            color: #0f6cbd;
        }

        .chart-tool:focus-visible {
            outline: 2px solid #0f6cbd;
            outline-offset: 1px;
        }

        .chart-tool:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .chart-tool svg {
            display: block;
        }

        /* Current zoom, to the right of the zoom buttons. */
        .zoom-level {
            align-self: center;
            min-width: 3.2em;
            padding-left: 2px;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            opacity: 0.8;
            pointer-events: none;
        }

        /* Chart size menu, opened from the dimensions icon. */
        .size-menu-wrap {
            position: relative;
            display: flex;
        }

        .chart-tool.active {
            opacity: 1;
            background: rgba(128, 128, 128, 0.18);
            color: #0f6cbd;
        }

        .size-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 210px;
            padding: 10px 12px 12px;
            border: 1px solid rgba(128, 128, 128, 0.35);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
            font-size: 13px;
        }

        .size-menu-title {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .size-menu-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .size-menu-row > span:first-child {
            width: 3.5em;
        }

        .size-menu-input {
            flex: 1;
            min-width: 0;
            padding: 4px 6px;
            border: 1px solid rgba(128, 128, 128, 0.45);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }

        .size-menu-input:focus-visible {
            outline: 2px solid #0f6cbd;
            outline-offset: -1px;
        }

        .size-menu-unit,
        .size-menu-hint {
            opacity: 0.7;
            font-size: 11px;
        }

        .size-menu-hint {
            margin: 4px 0 10px;
            line-height: 1.35;
        }

        .size-menu-auto {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid rgba(128, 128, 128, 0.45);
            border-radius: 4px;
            background: transparent;
            color: var(--text);
            font: inherit;
            cursor: pointer;
        }

        .size-menu-auto:hover:not(:disabled) {
            background: rgba(128, 128, 128, 0.18);
        }

        .size-menu-auto:disabled {
            opacity: 0.45;
            cursor: default;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- The chart toolbar, moved here from the task pane while the chart is in this
         window: bring the chart back to the pane, chart size, magnify (+) or
         shrink (−), then the Background / Order / Ends / Links options (set in the
         pane, which sends them back here). Fixed at the top of the window. -->
    <div class="chart-tools" id="chart-tools" role="toolbar" aria-label="Chart tools">
        <button id="popin-btn" class="chart-tool" type="button"
                title="Bring the chart back into the task pane"
                aria-label="Bring the chart back into the task pane">
            <!-- The pop-out icon reversed: the window (faint) with the chart set back down. -->
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
                <rect x="7" y="2" width="11" height="11" fill="currentColor" opacity="0.4" shape-rendering="crispEdges"/>
                <rect x="2.5" y="7.5" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges"/>
                <rect x="2" y="7" width="11" height="3" fill="currentColor" shape-rendering="crispEdges"/>
            </svg>
        </button>
        <span class="chart-only">
            <button id="size-btn" class="chart-tool" type="button" title="Chart size" aria-label="Chart size">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
                    <rect x="6" y="2" width="12" height="12" fill="currentColor" opacity="0.4" shape-rendering="crispEdges"/>
                    <rect x="6" y="16" width="12" height="2" fill="currentColor" shape-rendering="crispEdges"/>
                    <rect x="2" y="2" width="2" height="12" fill="currentColor" shape-rendering="crispEdges"/>
                </svg>
            </button>
            <button id="zoom-in-btn" class="chart-tool" type="button" title="Zoom in" aria-label="Zoom in">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
                    <circle cx="9" cy="9" r="6.25" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M13.75 13.75 17.5 17.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M6 8h6v2H6zM8 6h2v6H8z" fill="currentColor" shape-rendering="crispEdges"/>
                </svg>
            </button>
            <button id="zoom-out-btn" class="chart-tool" type="button" title="Zoom out" aria-label="Zoom out">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
                    <circle cx="9" cy="9" r="6.25" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M13.75 13.75 17.5 17.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M6 8h6v2H6z" fill="currentColor" shape-rendering="crispEdges"/>
                </svg>
            </button>
            <span id="zoom-level" class="zoom-level" aria-hidden="true">100%</span>
            <!-- A text label, then a small icon dropdown (iconSelect.ts), as in the pane. -->
            <span class="toolbar-fields">
                <span class="field">
                    <label for="background-mode">Background</label>
                    <select id="background-mode">
                        <option value="auto">Auto</option>
                        <option value="white">White</option>
                        <option value="dark">Dark</option>
                        <option value="transparent">Transparent</option>
                        <option value="custom">Custom…</option>
                    </select>
                    <input type="color" id="background-color" value="#f5f1e8" aria-label="Background color" title="Background color" hidden />
                </span>
                <span class="field">
                    <label for="node-order">Order</label>
                    <select id="node-order">
                        <option value="data">As in data</option>
                        <option value="color">Grouped by colour</option>
                    </select>
                </span>
                <span class="field">
                    <label for="end-align">Ends</label>
                    <select id="end-align">
                        <option value="left">Next to source</option>
                        <option value="justify">Far right</option>
                    </select>
                </span>
                <span class="field">
                    <label for="link-color">Links</label>
                    <select id="link-color">
                        <option value="source">By source</option>
                        <option value="target">By target</option>
                        <option value="neutral">Neutral</option>
                    </select>
                </span>
            </span>
        </span>
    </div>
    <main id="stage">
        <p id="message">Waiting for the chart…</p>
        <div id="chart-frame" hidden>
            <svg id="chart-svg" role="img" aria-label="Sankey diagram"></svg>
            <div id="tooltip" class="tooltip" hidden></div>
        </div>
    </main>
</body>
</html>
